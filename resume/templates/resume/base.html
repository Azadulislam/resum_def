<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Resume Manager{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f7f7f7; }
        nav { background: #1f2937; padding: 1rem 2rem; }
        nav a { color: white; text-decoration: none; margin-right: 1rem; font-weight: 600; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 1024px; margin: auto;background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .actions { margin-bottom: 1rem; }
        .actions a, button { display: inline-block; margin-right: 0.5rem; padding: 0.5rem 0.8rem; background: #2563eb; color: white; text-decoration: none; border: none; border-radius: 4px; cursor: pointer; }
        .actions a.secondary { background: #6b7280; }
        form p { display: flex; flex-direction: column; margin-bottom: 0.8rem; }
        form input, form textarea, form select { padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px; max-width: 420px; }
        ul { padding-left: 1.2rem; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'profile-list' %}">Profiles</a>
        {% if user.is_authenticated %}
        <a href="{% url 'section-list' %}">Sections</a>
        <a href="{% url 'section-item-list' %}">Section Items</a>
        <a href="{% url 'variation-list' %}">Variations</a>
        {% endif %}
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
